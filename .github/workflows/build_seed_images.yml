name: Build seed images
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} seed image
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm runners don't expose /dev/kvm.
          # nixos-generators' make-disk-image.nix declares
          # requiredSystemFeatures = [ "kvm" ] for performance reasons,
          # but qemu inside it falls back to TCG when KVM is missing.
          # We satisfy the Nix-level constraint by advertising kvm in
          # system-features anyway; the build then runs in software
          # emulation. Expect the inner nixos-install VM to be ~10–50×
          # slower than on x86_64.
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            extra_nix_config: |
              experimental-features = nix-command flakes
              system-features = kvm benchmark big-parallel nixos-test uid-range
          - arch: x86_64
            runs-on: ubuntu-24.04
            extra_nix_config: |
              experimental-features = nix-command flakes
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: ${{ matrix.extra_nix_config }}

      - name: Build compressed seed image
        run: nix build .#packages.${{ matrix.arch }}-linux.compressedImage --impure -L

      - name: Stage artifact with descriptive filename
        run: cp -L result ai-sandbox-${{ matrix.arch }}.qcow2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sandbox-${{ matrix.arch }}
          path: ai-sandbox-${{ matrix.arch }}.qcow2
          if-no-files-found: error
